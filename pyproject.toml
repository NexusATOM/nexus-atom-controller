[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-atom-controller"
version = "0.1.0"
description = "Nexus ATOM controller: autonomous Earth-model orchestration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["nexus-atom-core>=0.1,<0.2"]

[project.optional-dependencies]
agents = ["nexus-atom-agents>=0.1,<0.2"]
demo = ["nexus-atom-hpc>=0.1,<0.2", "nexus-atom-science>=0.1,<0.2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
atom = "nexus_atom_controller.cli:main"

[project.urls]
Repository = "https://github.com/NexusATOM/nexus-atom-controller"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_atom_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
